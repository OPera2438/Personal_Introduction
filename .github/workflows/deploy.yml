name: Deploy to GitHub Pages

# 推到 main 就自动发布；也可以在 Actions 页面手动触发
on:
  push:
    branches: [main]
  workflow_dispatch:

# GitHub Pages 部署所需的最小权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同时只跑一个部署，新的推送会取消排队中的旧任务
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      # 纯静态站点，没有构建步骤，整个仓库根目录直接上传
      - name: 打包站点文件
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4
